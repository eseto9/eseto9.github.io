<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Projects</title>
  <meta name="description" content="Games and apps I've made. Click any card to open it.">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <aside class="side">
      <div class="brand">
        <span class="app-mark" id="brandMark"></span>
        <div class="brand-text">
          <h1 id="name"></h1>
          <p class="tagline" id="tagline"></p>
        </div>
      </div>
      <div class="socials" id="social"></div>
    </aside>

    <main id="games">
      <div class="section-head">
        <h2>Projects <span class="count" id="count"></span></h2>
        <div class="segmented" id="filters" role="group" aria-label="Filter by tag"></div>
      </div>
      <ul class="grid" id="grid"></ul>
    </main>

    <footer class="site-foot">
      <p id="fine"></p>
      <p>© <span id="year"></span> <span id="footName"></span></p>
    </footer>
  </div>

  <script src="icons.js"></script>
  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
